# nginx site config for the Secret Santa static site.
# Copy to /etc/nginx/conf.d/default.conf, with index.html, santa.js and
# data/assignments.json in /usr/share/nginx/html.
#
# Only the three files the site needs are served; everything else returns 404.
# data/assignments.json must stay readable because the browser decrypts it locally.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Browser revalidates every time (cheap 304 via ETag), so a redeploy is picked up at once.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html { }

    location = /santa.js { }

    # No add_header here: one would drop every server-level header above.
    # index.html also fetches it with cache: "no-store".
    location = /data/assignments.json { }

    location / {
        return 404;
    }
}
